    .progress { position: relative; z-index: 10; margin: 12px 24px 0; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#1a1524'); }

    const API_URL = 'https://alter-ai.ruslan-akhmedov-2005.workers.dev';
    const XP_PER_LEVEL = 100;

    // ============ ХРАНИЛИЩЕ: CloudStorage + localStorage fallback ============
    function storageGet(key) {
      return new Promise((resolve) => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(key, (err, value) => {
            if (!err && value) { resolve(value); }
            else { resolve(localStorage.getItem(key)); }
          });
        } else {
          resolve(localStorage.getItem(key));
        }
      });
    }

    function storageSet(key, value) {
      return new Promise((resolve) => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem(key, value, () => {
            localStorage.setItem(key, value); // дублируем в localStorage
            resolve();
          });
        } else {
          localStorage.setItem(key, value);
          resolve();
        }
      });
    }

    // ============ СОСТОЯНИЕ ============
    let user = { name: 'друг', profession: 'medicine', role: 'student', course: '3', gender: 'male' };
    let progress = {
      xp: 0, level: 1, streak: 0, lastActiveDate: null,
      daily: { date: '', done: [] },
      stats: { tasks_total: 0, tasks_correct: 0 }
    };
    let customDisciplines = [];

    function todayStr() { return new Date().toISOString().split('T')[0]; }
    function yesterdayStr() {
      const d = new Date(); d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    function saveProgress() {
      storageSet('alter_progress', JSON.stringify(progress));
    }

    function updateStreak() {
      const today = todayStr();
      if (progress.lastActiveDate === today) return;
      if (progress.lastActiveDate === yesterdayStr()) progress.streak++;
      else progress.streak = 1;
      progress.lastActiveDate = today;
    }

    function addXp(amount) {
      progress.xp += amount;
      progress.level = Math.floor(progress.xp / XP_PER_LEVEL) + 1;
      updateStreak();
      saveProgress();
      renderTopBar();
    }

    // ============ БАЗА ДИСЦИПЛИН ============
    const disciplinesByProfession = {
      dentistry: [
        {value: 'therapy_stom', label: 'Терапевтическая стоматология', icon: '🦷'},

        {value: 'pediatric_stom', label: 'Детская стоматология', icon: '👶'},

        {value: 'implantology', label: 'Дентальная имплантология', icon: '⚙️'},
        {value: 'gnathology', label: 'Гнатология', icon: '📏'},

        {value: 'anesthesia', label: 'Местное обезболивание', icon: '💉'},
        {value: 'radiology', label: 'Лучевая диагностика', icon: '📡'},
        {value: 'oncostom', label: 'Онкостоматология', icon: '🎗️'},

      ],
      medicine: [
        {value: 'therapy', label: 'Терапия', icon: '🩺'},
        {value: 'surgery', label: 'Хирургия', icon: '🔪'},
        {value: 'pharmacology', label: 'Фармакология', icon: '💊'},
        {value: 'anatomy', label: 'Анатомия', icon: '🦴'},
        {value: 'cardiology', label: 'Кардиология', icon: '❤️'},

        {value: 'pathphys', label: 'Патофизиология', icon: '⚗️'}
      ],

        {value: 'criminal', label: 'Уголовное право', icon: '⚖️'},
        {value: 'admin', label: 'Административное', icon: '🏛️'},
        {value: 'tax', label: 'Налоговое право', icon: '💰'},
        {value: 'labor', label: 'Трудовое право', icon: '👷'},
        {value: 'constitutional', label: 'Конституционное', icon: '📕'}
      ],
      it: [
        {value: 'python', label: 'Python', icon: '🐍'},
        {value: 'algorithms', label: 'Алгоритмы', icon: '🔢'},
        {value: 'databases', label: 'Базы данных', icon: '🗄️'},
        {value: 'frontend', label: 'Frontend', icon: '🎨'},
        {value: 'backend', label: 'Backend', icon: '⚙️'},
        {value: 'devops', label: 'DevOps', icon: '🚀'},

      ],
      economics: [
        {value: 'micro', label: 'Микроэкономика', icon: '📈'},
        {value: 'macro', label: 'Макроэкономика', icon: '🌍'},
        {value: 'finance', label: 'Финансы', icon: '💵'},
        {value: 'accounting', label: 'Бухучёт', icon: '📊'},
        {value: 'marketing', label: 'Маркетинг', icon: '🎯'}
      ],
      other: [
        {value: 'general', label: 'Общее развитие', icon: '📖'},
        {value: 'logic', label: 'Логика', icon: '🧩'}
      ]
    };

    // ============ ЭЛЕМЕНТЫ ============
    const levelCounter = document.getElementById('levelCounter');
    const xpCounter = document.getElementById('xpCounter');
    const streakCounter = document.getElementById('streakCounter');
    const streakLabel = document.getElementById('streakLabel');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const xpPopup = document.getElementById('xpPopup');
    const bubble = document.getElementById('bubble');

    function renderTopBar() {
      levelCounter.textContent = progress.level;
      xpCounter.textContent = progress.xp;
      streakCounter.textContent = progress.streak;
      const n = progress.streak;
      let label = 'дней';
      if (n % 10 === 1 && n % 100 !== 11) label = 'день';
      else if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) label = 'дня';
      streakLabel.textContent = label;
      const xpInLevel = progress.xp % XP_PER_LEVEL;
      progressFill.style.width = xpInLevel + '%';
      progressLabel.textContent = `${xpInLevel} / ${XP_PER_LEVEL} XP до следующего уровня`;
    }

    function renderHabits() {
      document.querySelectorAll('.habit').forEach(habit => {
        const id = habit.dataset.habit;
        if (progress.daily.done.includes(id)) {
          habit.classList.add('done');
          habit.querySelector('.habit-check').textContent = '✓';
        } else {
          habit.classList.remove('done');
          habit.querySelector('.habit-check').textContent = '';
        }
      });
    }

    function renderUser() {
      document.getElementById('userName').textContent = user.name;
      const profMap = { medicine: 'Медик', dentistry: 'Стоматолог', law: 'Юрист', it: 'IT-специалист', economics: 'Экономист', other: 'Специалист' };
      const roleMap = { school: 'Школьник', student: 'Студент', work: 'Специалист' };
      const courseMap = { '1': '1 курс', '2': '2 курс', '3': '3 курс', '4': '4 курс', '5': '5-6 курс' };
      const prof = profMap[user.profession] || '';
      const role = roleMap[user.role] || '';
      const courseStr = user.role === 'student' && user.course ? ' · ' + (courseMap[user.course] || '') : '';
      document.getElementById('userLevel').textContent = ([role, prof].filter(Boolean).join(' · ') + courseStr).replace(/^ · /, '') || 'Твой Альтер';
      if (user.gender === 'female') {
        document.getElementById('character').src = 'charactel_female.png.png';
      }
      bubble.textContent = `Привет, ${user.name}! Готов начать день?`;
    }

    // ============ ОБЫЧНЫЕ ПРИВЫЧКИ ============
    document.querySelectorAll('.habit:not(#taskHabit)').forEach(habit => {
      habit.addEventListener('click', () => {
        const id = habit.dataset.habit;
        if (progress.daily.done.includes(id)) return;
        progress.daily.done.push(id);
        const xp = parseInt(habit.dataset.xp);
        addXp(xp);
        renderHabits();
        showXpPopup(xp);
        bubble.textContent = [`Отличная работа, ${user.name}!`, 'Я чувствую, как мы растём!', 'Так держать!', 'Ещё немного — и новый уровень!'][Math.floor(Math.random() * 4)];
        bubble.style.animation = 'none';
        setTimeout(() => { bubble.style.animation = 'bubbleIn 0.5s ease-out'; }, 10);
      });
    });

    // ============ AI-ЗАДАЧА ============
    const taskHabit = document.getElementById('taskHabit');
    const modal = document.getElementById('taskModal');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    const modalTitle = document.getElementById('modalTitle');

    taskHabit.addEventListener('click', () => {
      if (progress.daily.done.includes('ai_task')) return;
      modal.classList.add('active');
      showDisciplineSelector();
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    function showDisciplineSelector() {
      modalTitle.textContent = '📖 Выбери дисциплину';
      const baseList = disciplinesByProfession[user.profession] || disciplinesByProfession.other;
      const allDisciplines = [...baseList, ...customDisciplines];
      const itemsHtml = allDisciplines.map(d => `
        <button class="discipline-item" data-value="${d.value}">
          <span class="di-icon">${d.icon || '📌'}</span>
          <span>${d.label}</span>
        </button>
      `).join('');
      modalBody.innerHTML = `
        <div class="section-label">По какой теме задача?</div>
        <div class="discipline-list" id="disciplineList">${itemsHtml}</div>
        <button class="add-custom-btn" id="addCustomBtn">➕ Добавить свою дисциплину</button>
        <div class="custom-input-wrap" id="customInputWrap">
          <input type="text" class="custom-input" id="customInput" placeholder="Например: Геронтостоматология" maxlength="50">
          <div class="custom-actions">
            <button class="custom-cancel" id="customCancel">Отмена</button>
            <button class="custom-save" id="customSave">Сохранить</button>
          </div>
        </div>
        <button class="start-task-btn" id="startTaskBtn" disabled>Начать задачу</button>
      `;
      let selectedDiscipline = null;
      document.querySelectorAll('.discipline-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.discipline-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          selectedDiscipline = item.dataset.value;
          document.getElementById('startTaskBtn').disabled = false;
        });
      });
      const addBtn = document.getElementById('addCustomBtn');
      const inputWrap = document.getElementById('customInputWrap');
      const input = document.getElementById('customInput');
      addBtn.addEventListener('click', () => {
        inputWrap.classList.add('active');
        addBtn.style.display = 'none';
        setTimeout(() => input.focus(), 200);
      });
      document.getElementById('customCancel').addEventListener('click', () => {
        inputWrap.classList.remove('active');
        addBtn.style.display = 'block';
        input.value = '';
      });
      document.getElementById('customSave').addEventListener('click', () => {
        const val = input.value.trim();
        if (val.length < 2) return;
        const value = 'custom_' + Date.now();
        const newDisc = { value, label: val, icon: '📌', custom: true };
        customDisciplines.push(newDisc);
        storageSet('alter_custom_disciplines', JSON.stringify(customDisciplines));
        showDisciplineSelector();
        setTimeout(() => {
          const newBtn = document.querySelector(`.discipline-item[data-value="${value}"]`);
          if (newBtn) newBtn.click();
        }, 100);
      });
      document.getElementById('startTaskBtn').addEventListener('click', () => {
        if (selectedDiscipline) generateTask(selectedDiscipline);
      });
    }

    async function generateTask(discipline) {
      const baseList = disciplinesByProfession[user.profession] || disciplinesByProfession.other;
      const allDisc = [...baseList, ...customDisciplines];
      const found = allDisc.find(d => d.value === discipline);
      const disciplineLabel = found ? found.label : discipline;
      modalTitle.textContent = '📖 AI-задача';
      modalBody.innerHTML = `
        <div class="modal-loading">
          <div class="spinner"></div>
          <div class="loading-text">AI готовит задачу по «${disciplineLabel}»...</div>
        </div>
      `;
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            profession: user.profession || 'medicine',
            discipline: disciplineLabel,
            course: user.course || '',
            topic: ''
          })
        });
        if (!response.ok) throw new Error('API error');
        const task = await response.json();
        showTask(task);
      } catch (e) {
        modalBody.innerHTML = `
          <div style="text-align:center;padding:20px;color:#f44336;">
            ⚠️ Не удалось загрузить задачу.<br>
            <span style="font-size:12px;opacity:0.7;">${e.message}</span>
          </div>
          <button class="start-task-btn" onclick="document.getElementById('taskModal').classList.remove('active')">Закрыть</button>
        `;
      }
    }

    function showTask(task) {
      const optionsHtml = task.options.map((opt, i) => `<button class="task-option" data-index="${i}">${opt}</button>`).join('');
      modalBody.innerHTML = `
        <div class="task-question">${task.question}</div>
        <div class="task-options">${optionsHtml}</div>
        <div id="taskResult"></div>
      `;
      document.querySelectorAll('.task-option').forEach(btn => {
        btn.addEventListener('click', () => checkAnswer(parseInt(btn.dataset.index), task));
      });
    }

    function checkAnswer(userIdx, task) {
      const options = document.querySelectorAll('.task-option');
      const result = document.getElementById('taskResult');
      const isCorrect = userIdx === task.correct;
      options.forEach((btn, i) => {
        btn.disabled = true;
        if (i === task.correct) btn.classList.add('correct');
        else if (i === userIdx && !isCorrect) btn.classList.add('wrong');
      });
      progress.stats.tasks_total++;
      if (isCorrect) {
        progress.stats.tasks_correct++;
        result.innerHTML = `<div class="task-result correct">✓ Правильно!</div><div class="task-explanation">${task.explanation || ''}</div>`;
        progress.daily.done.push('ai_task');
        const xp = task.xp || 20;
        addXp(xp);
        renderHabits();
        showXpPopup(xp);
        bubble.textContent = `Правильно! +${xp} XP`;
        bubble.style.animation = 'none';
        setTimeout(() => { bubble.style.animation = 'bubbleIn 0.5s ease-out'; }, 10);
      } else {
        saveProgress();
        result.innerHTML = `<div class="task-result wrong">✗ Неправильно</div><div class="task-explanation">${task.explanation || ''}</div>`;
      }
    }

    function showXpPopup(xp) {
      xpPopup.textContent = `+${xp} XP`;
      xpPopup.classList.remove('show');
      void xpPopup.offsetWidth;
      xpPopup.classList.add('show');
    }

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    async function init() {
      // Загружаем пользователя
      const savedUser = await storageGet('alter_user');
      if (savedUser) {
        try { user = { ...user, ...JSON.parse(savedUser) }; } catch(e) {}
      }

      // Загружаем прогресс
      const savedProgress = await storageGet('alter_progress');
      if (savedProgress) {
        try {
          const p = JSON.parse(savedProgress);
          // Если новый день — сбрасываем галочки
          if (p.daily && p.daily.date !== todayStr()) {
            p.daily = { date: todayStr(), done: [] };
            await storageSet('alter_progress', JSON.stringify(p));
          }
          progress = { ...progress, ...p };
        } catch(e) {}
      } else {
        progress.daily.date = todayStr();
        await storageSet('alter_progress', JSON.stringify(progress));
      }

      // Загружаем кастомные дисциплины
      const savedCustom = await storageGet('alter_custom_disciplines');
      if (savedCustom) {
        try { customDisciplines = JSON.parse(savedCustom); } catch(e) {}
      }

      // Отрисовка
      renderUser();
      renderTopBar();
      renderHabits();
    }

    init();
  </script>
</body>
</html>
